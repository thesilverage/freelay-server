[package]
name = "freelay-server"
version = "0.1.0-beta.1"
edition = "2021"
description = "Self-hosted Freelay collaboration and Ed25519 control plane"
license = "MIT"
homepage = "https://github.com/thesilverage/freelay-server"
repository = "https://github.com/thesilverage/freelay-server"
build = "build.rs"

# Keep the upstream Rust module boundary stable while renaming the product.
[lib]
name = "relay"

[[bin]]
name = "freelay"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.72"
async-trait = "0.1.71"
axum = { version = "0.7.4", features = ["ws", "multipart"] }
axum-extra = { version = "0.9.2", features = ["typed-header"] }
clap = { version = "4.3.12", features = ["derive", "env"] }
colored = "2.0.4"
dashmap = "6.0.1"
futures = "0.3.28"
headers = "0.4.0"
lib0 = "0.16.9"
nanoid = "0.4.0"
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.103"
tokio = { version = "1.29.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1.14"
tokio-util = { version = "0.7.11", features = ["rt"] }
toml = "0.8"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter", "fmt"] }
url = "2.4.0"
y-sweet-core = { version = "0.8.2", path = "../y-sweet-core", features=["sync"] }
yrs = { version = "0.26.0" }
yrs-kvstore = "0.3.0"
bincode = "1.3.3"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hex = "0.4.3"
prometheus = "0.13"
p256 = "0.13.2"
ed25519-dalek = { version = "2.1.1", features = ["pkcs8", "pem"] }
sha2 = "0.10"
tempfile = "3.8.1"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
coset = "0.3"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["cors"] }
fs2 = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http = "1.1.0"
tempfile = "3.8.1"
tokio = { version = "1.29.1", features = ["test-util"] }
tokio-tungstenite = "0.24.0"
